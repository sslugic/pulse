<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Admin</title>
<style>
  :root { --bg: #0b0c0d; --card: #1c1f21; --line: #2c3033; --text: #f4f1e8; --dim: #a7a9ad; --lime: #9cff2e; --cyan: #38d6ff; --pink: #ff4fa0; --yellow: #ffd23f; --red: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  header { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; }
  h1 span { color: var(--lime); }
  .stats { color: var(--dim); font-size: 13px; }
  .stats b { color: var(--text); }
  input, button { font: inherit; color: var(--text); }
  input { background: #121416; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input:focus { outline: none; border-color: var(--cyan); }
  button { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.go { background: var(--lime); color: #0b0c0d; border-color: var(--lime); font-weight: 600; }
  main { padding: 16px 20px 40px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.user:hover td { background: #121416; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .bal { font-weight: 700; color: var(--cyan); }
  .who { font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; word-break: break-all; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; color: #0b0c0d; }
  .tag.guest { background: var(--yellow); }
  .tag.pro { background: var(--pink); }
  .label { width: 160px; }
  .grant { display: flex; gap: 6px; }
  .grant .amt { width: 70px; }
  .grant .note { width: 140px; }
  tr.ledger td { background: #111315; }
  .ledger table td, .ledger table th { padding: 4px 8px; font-size: 12px; }
  .plus { color: var(--lime); }
  .minus { color: var(--red); }
  #msg { position: fixed; bottom: 16px; right: 16px; padding: 10px 14px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); display: none; max-width: 420px; }
  #msg.err { border-color: var(--red); }
  .empty { color: var(--dim); padding: 24px 8px; }
  section.store { margin-bottom: 28px; }
  section.store h2, section.accounts h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 0 0 10px; display: flex; gap: 10px; align-items: center; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .k { color: var(--dim); font-size: 12px; }
  .note { color: var(--dim); font-size: 12px; margin: 6px 0; }
  .note.warn { color: var(--yellow); }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; margin: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>PULSE <span>ADMIN</span></h1>
  <div class="stats" id="stats">Loading…</div>
  <div style="display:flex;gap:8px">
    <input id="q" placeholder="Search label, name, email, id" style="width:260px">
    <button id="reload">Reload</button>
  </div>
</header>
<main>
  <section class="store">
    <h2>App Store · last 30 days <button id="storeReload" style="font-size:11px;padding:2px 8px">Refresh</button></h2>
    <div id="store"><p class="note">Loading App Store numbers…</p></div>
  </section>
  <section class="accounts">
  <h2>Accounts</h2>
  <table>
    <thead>
      <tr>
        <th>Label</th><th>Account</th><th>Joined</th><th>Last sign-in</th>
        <th class="num">Balance</th><th class="num">Bought</th><th class="num">Used</th><th>Grant credits</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="9" class="empty">Loading accounts from production…</td></tr></tbody>
  </table>
  </section>
</main>
<div id="msg"></div>
<script>
  const $ = (s, el = document) => el.querySelector(s);
  let users = [];

  async function api(path, body) {
    const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json', 'x-pulse-admin': '1' }, body: JSON.stringify(body) } : {});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }
  function toast(text, err) {
    const m = $('#msg'); m.textContent = text; m.className = err ? 'err' : ''; m.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(() => (m.style.display = 'none'), 4000);
  }
  const day = (v) => (v ? new Date(v).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '–');
  const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

  function render() {
    const q = $('#q').value.trim().toLowerCase();
    const list = users.filter((u) => !q || [u.label, u.name, u.email, u.id].some((v) => (v || '').toLowerCase().includes(q)));
    const total = users.reduce((s, u) => s + Number(u.balance || 0), 0);
    $('#stats').innerHTML = '';
    $('#stats').append(
      el('b', { textContent: users.length }), ' accounts · ',
      el('b', { textContent: users.filter((u) => u.guest).length }), ' guests · ',
      el('b', { textContent: users.filter((u) => u.pro).length }), ' Pro · ',
      el('b', { textContent: total.toLocaleString() }), ' credits outstanding',
    );
    const body = $('#rows'); body.innerHTML = '';
    if (!list.length) body.append(el('tr', {}, el('td', { colSpan: 9, className: 'empty', textContent: q ? 'No match.' : 'No accounts yet.' })));
    for (const u of list) {
      const label = el('input', { className: 'label', value: u.label, placeholder: 'Who is this?' });
      const saveLabel = async () => {
        if (label.value.trim() === u.label) return;
        try { await api('/api/label', { id: u.id, label: label.value }); u.label = label.value.trim(); toast('Label saved'); } catch (e) { toast(e.message, true); }
      };
      label.addEventListener('blur', saveLabel);
      label.addEventListener('keydown', (e) => e.key === 'Enter' && label.blur());

      const who = el('div', { className: 'who', textContent: u.name || u.email || (u.guest ? 'Guest' : 'No name') });
      if (u.guest) who.append(el('span', { className: 'tag guest', textContent: 'guest' }));
      if (u.pro) who.append(el('span', { className: 'tag pro', textContent: 'Pro' }));
      const acct = el('td', {}, who, el('div', { className: 'sub', textContent: [u.name && u.email, u.id].filter(Boolean).join(' · ') }));

      const amt = el('input', { className: 'amt', type: 'number', step: 1, placeholder: '+100' });
      const note = el('input', { className: 'note', placeholder: 'Note (optional)' });
      const give = el('button', { className: 'go', textContent: 'Grant' });
      give.addEventListener('click', async () => {
        const n = Number(amt.value);
        if (!Number.isInteger(n) || n === 0) return toast('Enter a whole number, e.g. 100 or -50', true);
        const name = u.label || u.name || u.email || u.id;
        if (!confirm(`${n > 0 ? 'Grant' : 'Remove'} ${Math.abs(n)} credits ${n > 0 ? 'to' : 'from'} ${name}?\n\nThis writes to production.`)) return;
        give.disabled = true;
        try {
          const r = await api('/api/grant', { id: u.id, amount: n, note: note.value, nonce: crypto.randomUUID() });
          u.balance = r.balance; amt.value = ''; note.value = ''; render();
          toast(`Done. ${name} now has ${Number(r.balance).toLocaleString()} credits.`);
        } catch (e) { toast(e.message, true); } finally { give.disabled = false; }
      });

      const hist = el('button', { textContent: 'History' });
      const row = el('tr', { className: 'user' },
        el('td', {}, label), acct,
        el('td', { textContent: day(u.created_at) }), el('td', { textContent: day(u.last_sign_in_at) }),
        el('td', { className: 'num bal', textContent: Number(u.balance).toLocaleString() }),
        el('td', { className: 'num', textContent: Number(u.bought).toLocaleString() }),
        el('td', { className: 'num', textContent: Number(u.used).toLocaleString() }),
        el('td', {}, el('div', { className: 'grant' }, amt, note, give)),
        el('td', {}, hist),
      );
      body.append(row);
      hist.addEventListener('click', async () => {
        if (row.nextSibling && row.nextSibling.classList?.contains('ledger')) return row.nextSibling.remove();
        hist.disabled = true;
        try {
          const items = await api('/api/ledger?id=' + u.id);
          const t = el('table', {}, el('tr', {}, ...['When', 'Change', 'Reason', 'Ref', 'Note'].map((h) => el('th', { textContent: h }))));
          for (const it of items) t.append(el('tr', {},
            el('td', { textContent: new Date(it.created_at).toLocaleString() }),
            el('td', { className: it.delta > 0 ? 'plus num' : 'minus num', textContent: (it.delta > 0 ? '+' : '') + it.delta }),
            el('td', { textContent: it.reason }), el('td', { className: 'sub', textContent: it.ref || '' }),
            el('td', { className: 'sub', textContent: (it.meta && (it.meta.note || it.meta.feature || it.meta.product_id)) || '' }),
          ));
          if (!items.length) t.append(el('tr', {}, el('td', { colSpan: 5, className: 'sub', textContent: 'No credit history.' })));
          row.after(el('tr', { className: 'ledger' }, el('td', { colSpan: 9 }, t)));
        } catch (e) { toast(e.message, true); } finally { hist.disabled = false; }
      });
    }
  }

  async function load() {
    $('#rows').innerHTML = '<tr><td colspan="9" class="empty">Loading accounts from production…</td></tr>';
    try { users = await api('/api/users'); render(); } catch (e) {
      // Keep the failure on screen (a blank table reads as "no accounts"); usually the server was restarting.
      const msg = e instanceof TypeError ? 'Couldn’t reach the admin server. Is `npm run admin` running?' : e.message;
      $('#rows').innerHTML = '';
      $('#rows').append(el('tr', {}, el('td', { colSpan: 9, className: 'empty', textContent: msg + ' Press Reload to try again.' })));
      $('#stats').textContent = '';
    }
  }
  async function loadStore(fresh) {
    const box = $('#store');
    box.innerHTML = '<p class="note">Loading App Store numbers…</p>';
    try {
      const st = await api('/api/appstore' + (fresh ? '?fresh=1' : ''));
      const t = st.totals, fmt = (n) => (n == null ? '–' : Number(n).toLocaleString());
      const cards = [
        ['First-time downloads', st.salesConfigured ? fmt(t.firstDownloads) : '–'],
        ['Redownloads', st.salesConfigured ? fmt(t.redownloads) : '–'],
        ['In-app purchases', st.salesConfigured ? fmt(t.purchases) : '–'],
        ['Proceeds', st.salesConfigured && t.proceeds ? `${t.proceeds.toLocaleString()} ${t.currency}` : '–'],
        ['Impressions', st.analytics.haveData ? fmt(t.impressions) : '–'],
        ['Product page views', st.analytics.haveData ? fmt(t.pageViews) : '–'],
        ['Conversion (page → download)', st.analytics.haveData && t.conversion != null ? (t.conversion * 100).toFixed(1) + '%' : '–'],
      ];
      box.innerHTML = '';
      box.append(el('div', { className: 'cards' }, ...cards.map(([k, v]) => el('div', { className: 'card' }, el('div', { className: 'v', textContent: v }), el('div', { className: 'k', textContent: k })))));
      if (!st.salesConfigured) box.append(el('p', { className: 'note warn', textContent: 'Downloads and purchases need your vendor number in tools/admin/asc.json ("vendorNumber"). Find it in App Store Connect → Payments and Financial Reports.' }));
      if (st.analytics.error) box.append(el('p', { className: 'note warn', textContent: 'Analytics: ' + st.analytics.error }));
      else if (!st.analytics.haveData) box.append(el('p', { className: 'note', textContent: st.analytics.requestCreated ? 'Asked Apple to start generating analytics reports just now. Impressions, page views and conversion appear in about 1–2 days.' : 'Analytics reports are requested; Apple hasn’t delivered data yet (usually 1–2 days after the first request).' }));
      const days = st.rows.filter((r) => r.firstDownloads || r.redownloads || r.purchases || r.impressions || r.pageViews || r.downloads).reverse();
      if (days.length) {
        const tb = el('table', {}, el('tr', {}, ...['Day', 'Downloads', 'Redownloads', 'Purchases', 'Impressions', 'Page views', 'Conversion'].map((h) => el('th', { textContent: h, className: h === 'Day' ? '' : 'num' }))));
        for (const r of days) tb.append(el('tr', {},
          el('td', { textContent: r.date }),
          ...[r.firstDownloads, r.redownloads, r.purchases, r.impressions, r.pageViews].map((v) => el('td', { className: 'num', textContent: fmt(v || 0) })),
          el('td', { className: 'num', textContent: r.pageViews ? ((r.downloads / r.pageViews) * 100).toFixed(1) + '%' : '–' }),
        ));
        box.append(el('details', {}, el('summary', { textContent: `By day (${days.length} days with activity)` }), tb));
      }
    } catch (e) {
      box.innerHTML = '';
      box.append(el('p', { className: 'note warn', textContent: e.message }));
    }
  }
  $('#storeReload').addEventListener('click', () => loadStore(true));
  loadStore(false);
  $('#q').addEventListener('input', render);
  $('#reload').addEventListener('click', load);
  load();
</script>
</body>
</html>
